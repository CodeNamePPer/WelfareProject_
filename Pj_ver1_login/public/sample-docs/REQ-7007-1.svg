<svg xmlns="http://www.w3.org/2000/svg" width="600" height="540" viewBox="0 0 600 540">
<style>
text{font-family:"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif;fill:#1e293b}
.h{font-size:26px;font-weight:700}.s{font-size:15px;fill:#475569}.l{font-size:16px;fill:#475569}
.v{font-size:16px;font-weight:600}.t{font-size:22px;font-weight:700}.f{font-size:13px;fill:#64748b}
.w{font-size:88px;font-weight:700;fill:#dc2626;opacity:.12}
</style>
<rect width="600" height="540" fill="#fffdf8"/>
<rect x="12" y="12" width="576" height="516" fill="none" stroke="#cbd5e1" stroke-width="2"/>
<text x="48" y="78" class="h">สำนักทะเบียนตัวอย่าง</text>
<text x="48" y="108" class="s">เอกสารตัวอย่างสำหรับทดสอบระบบ</text>
<line x1="48" y1="132" x2="552" y2="132" stroke="#1e293b" stroke-width="2"/>
<text x="48" y="182" class="h" font-size="22">สำเนาทะเบียนบ้าน</text>
<text x="48" y="250" class="l">เจ้าของชื่อ</text><text x="552" y="250" class="v" text-anchor="end">นางพิมพ์ชนก วงศ์ไทย</text>
<line x1="48" y1="264" x2="552" y2="264" stroke="#e2e8f0"/>
<text x="48" y="290" class="l">บ้านเลขที่</text><text x="552" y="290" class="v" text-anchor="end">45/6</text>
<line x1="48" y1="304" x2="552" y2="304" stroke="#e2e8f0"/>
<text x="48" y="330" class="l">ถนน</text><text x="552" y="330" class="v" text-anchor="end">พหลโยธิน</text>
<line x1="48" y1="344" x2="552" y2="344" stroke="#e2e8f0"/>
<text x="48" y="370" class="l">แขวง / เขต</text><text x="552" y="370" class="v" text-anchor="end">สามเสนใน / พญาไท</text>
<line x1="48" y1="384" x2="552" y2="384" stroke="#e2e8f0"/>
<text x="48" y="410" class="l">จังหวัด</text><text x="552" y="410" class="v" text-anchor="end">กรุงเทพมหานคร</text>
<line x1="48" y1="424" x2="552" y2="424" stroke="#e2e8f0"/>

<text x="48" y="500" class="f">รับรองสำเนาถูกต้อง</text>
<text x="300" y="300" class="w" text-anchor="middle" transform="rotate(-24 300 270)">ตัวอย่าง</text>
</svg>